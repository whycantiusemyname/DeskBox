name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RestoreLockedMode: true
      BuildOfflineArtifact: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.repository != 'Tianyu199509/DeskBox') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit message attribution check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $messages = git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD"
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - name: Setup pinned Rust toolchain
        if: env.BuildOfflineArtifact == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify pinned .NET and Rust toolchains
        if: env.BuildOfflineArtifact == 'true'
        shell: pwsh
        run: |
          $dotnetVersion = (dotnet --version).Trim()
          if ($dotnetVersion -ne '10.0.402') {
            throw "Expected .NET SDK 10.0.402, found '$dotnetVersion'."
          }

          $rustcDetails = rustc -vV | Out-String
          if ($rustcDetails -notmatch '(?m)^release: 1\.96\.0\s*$' -or
              $rustcDetails -notmatch '(?m)^host: x86_64-pc-windows-msvc\s*$') {
            throw "Expected Rust 1.96.0 x86_64-pc-windows-msvc; got:`n$rustcDetails"
          }

          $rustTargetLib = (rustc --print target-libdir --target x86_64-pc-windows-msvc).Trim()
          if (-not (Test-Path -LiteralPath $rustTargetLib -PathType Container)) {
            throw "Rust target x86_64-pc-windows-msvc is not installed at '$rustTargetLib'."
          }
          dotnet --info
          cargo --version

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Verify complete feature test results
        if: always() && env.BuildOfflineArtifact == 'true'
        shell: pwsh
        run: |
          $resultFiles = @(Get-ChildItem -LiteralPath '.\tests\DeskBox.Tests\TestResults' -Filter '*.trx' -File -ErrorAction SilentlyContinue)
          if ($resultFiles.Count -eq 0) {
            throw 'The feature run produced no TRX test results.'
          }

          foreach ($resultFile in $resultFiles) {
            [xml]$result = Get-Content -LiteralPath $resultFile.FullName -Raw
            $counters = $result.TestRun.ResultSummary.Counters
            if ($null -eq $counters) {
              throw "The TRX result has no completion counters: '$($resultFile.FullName)'."
            }
            $total = [int]$counters.total
            $passed = [int]$counters.passed
            Write-Host "$($resultFile.Name): $passed/$total passed."
            if ($total -eq 0 -or $passed -ne $total) {
              throw "The feature run did not complete with every test passing in '$($resultFile.FullName)'."
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Publish self-contained x64 Native AOT build
        if: env.BuildOfflineArtifact == 'true'
        shell: pwsh
        run: .\scripts\publish-aot-retail.ps1 -Platform x64

      - name: Prepare executable update artifact
        if: env.BuildOfflineArtifact == 'true'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD '.artifacts\aot-retail\win-x64\publish'
          $executablePath = Join-Path $publishDirectory 'DeskBox.exe'
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "The self-contained DeskBox.exe was not produced in '$publishDirectory'."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $publishDirectory 'DeskBox.pri') -PathType Leaf)) {
            throw "DeskBox.pri was not produced in '$publishDirectory'; XAML resources cannot be updated without it."
          }

          $updateDirectory = Join-Path $PWD '.artifacts\executable-update'
          New-Item -ItemType Directory -Path $updateDirectory -Force | Out-Null

          # The update runs on top of a deployed compatible runtime, so only
          # application-owned files travel here. The PRI carries the XAML
          # resources; Assets and ThirdParty are the app's published content.
          # Never enumerate the publish root: it also contains the ~130 MiB
          # Windows App SDK runtime.
          $applicationPayload = @(
            'DeskBox.exe',
            'DeskBox.pri',
            'Assets',
            'ThirdParty'
          )
          $publishedRoot = $publishDirectory.TrimEnd('\', '/')
          $payloadFiles = [System.Collections.Generic.List[object]]::new()
          foreach ($relativeRoot in $applicationPayload) {
            $sourcePath = Join-Path $publishDirectory $relativeRoot
            if (-not (Test-Path -LiteralPath $sourcePath)) {
              throw "Required application payload '$relativeRoot' is missing from '$publishDirectory'."
            }

            $sourceItem = Get-Item -LiteralPath $sourcePath
            $sourceFiles = if ($sourceItem.PSIsContainer) {
              @(Get-ChildItem -LiteralPath $sourcePath -File -Recurse)
            } else {
              @($sourceItem)
            }
            foreach ($sourceFile in $sourceFiles) {
              $relativePath = $sourceFile.FullName.Substring(
                $publishedRoot.Length + 1).Replace('\', '/')
              $destinationPath = Join-Path $updateDirectory $relativePath
              $destinationDirectory = Split-Path -Parent $destinationPath
              if ($destinationDirectory) {
                New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
              }
              Copy-Item -LiteralPath $sourceFile.FullName -Destination $destinationPath -Force
              $payloadFiles.Add([ordered]@{
                path = $relativePath
                sha256 = (Get-FileHash -LiteralPath $sourceFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              })
            }
          }

          $manifest = [ordered]@{
            gitSha = (git rev-parse HEAD).Trim()
            compatibleRuntimeVersion = '2.5.1'
            exeSha256 = (Get-FileHash -LiteralPath $executablePath -Algorithm SHA256).Hash.ToLowerInvariant()
            files = @($payloadFiles | Sort-Object { $_.path })
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $updateDirectory 'manifest.json') -Encoding utf8NoBOM

      - name: Package runnable offline build
        if: env.BuildOfflineArtifact == 'true'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD '.artifacts\aot-retail\win-x64\publish'
          $summaryPath = Join-Path $PWD '.artifacts\aot-retail\win-x64\summary.json'
          if (-not (Test-Path -LiteralPath (Join-Path $publishDirectory 'DeskBox.exe') -PathType Leaf)) {
            throw "The self-contained DeskBox.exe was not produced in '$publishDirectory'."
          }
          if (-not (Test-Path -LiteralPath $summaryPath -PathType Leaf)) {
            throw "The Native AOT publish summary is missing: '$summaryPath'."
          }

          $archivePath = Join-Path $PWD '.artifacts\DeskBox-x64-offline.zip'
          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal
          Get-FileHash -LiteralPath $archivePath -Algorithm SHA256 | Format-List | Out-String | Write-Host

      - name: Upload runnable offline x64 build
        if: env.BuildOfflineArtifact == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: DeskBox-x64-offline
          path: |
            .artifacts/DeskBox-x64-offline.zip
            .artifacts/aot-retail/win-x64/summary.json
            .artifacts/aot-retail/win-x64/publish.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload x64 executable update
        if: env.BuildOfflineArtifact == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: DeskBox-x64-executable-update
          path: .artifacts/executable-update/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
